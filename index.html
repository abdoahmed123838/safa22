<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد الصفصف❤️ | 22 / 11</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff2a5f;
            --accent: #ff758f;
            --gold: #ffd166;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #3b0d22 0%, #090205 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            text-align: center;
        }

        .promo-card {
            background: var(--glass);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--glass-border);
            padding: 40px 24px;
            border-radius: 32px;
            max-width: 410px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(255, 42, 95, 0.18);
            position: relative;
            z-index: 2;
            animation: fadeUp 1s ease;
        }

        .badge-22 {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), #ff758f);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
        }

        .promo-card h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .promo-card p {
            font-size: 0.94rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            line-height: 1.65;
        }

        .promo-timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 22px 0;
        }

        .promo-box {
            background: rgba(255, 42, 95, 0.15);
            border: 1px solid rgba(255, 117, 143, 0.35);
            padding: 12px 4px;
            border-radius: 16px;
        }

        .promo-box span {
            display: block;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--gold);
        }

        .promo-box small {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .teaser-note {
            background: rgba(0, 0, 0, 0.35);
            border: 1px dashed rgba(255, 209, 102, 0.45);
            padding: 13px;
            border-radius: 15px;
            font-size: 0.86rem;
            color: #ffe5ec;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .btn-locked {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #fff;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s;
        }

        .btn-locked:hover {
            background: rgba(255, 42, 95, 0.25);
        }

        #music-control {
            position: fixed;
            bottom: 22px;
            left: 22px;
            background: linear-gradient(135deg, var(--primary), #ff5c8a);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.4);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 100;
            display: flex;
            box-shadow: 0 8px 20px rgba(255, 42, 95, 0.5);
            align-items: center;
            justify-content: center;
        }

        .floating-heart {
            position: fixed;
            bottom: -30px;
            pointer-events: none;
            z-index: 1;
            animation: floatHeart linear forwards;
        }

        @keyframes floatHeart {
            0% { transform: translateY(0) scale(0.8); opacity: 0.6; }
            100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <audio id="promo-music" loop autoplay>
        <source src="promo.mp3" type="audio/mpeg">
    </audio>
    <button id="music-control" onclick="toggleMusic()" title="تشغيل/إيقاف الموسيقى">🔊</button>

    <div class="promo-card" id="promo-card">
        <span class="badge-22">عيد ميلاد الصفصف ✨</span>
        <h1>❤️😍</h1>
        <p>الموقع ده عشانك إنتي وبس، ومش هيفتح غير في لحظة عيد ميلادك الـ 22 يوم <strong>22 / 11</strong> الساعة 12 بالليل!</p>
        
        <div class="promo-timer">
            <div class="promo-box"><span id="p-days">0</span><small>يوم</small></div>
            <div class="promo-box"><span id="p-hours">0</span><small>ساعة</small></div>
            <div class="promo-box"><span id="p-minutes">0</span><small>دقيقة</small></div>
            <div class="promo-box"><span id="p-seconds">0</span><small>ثانية</small></div>
        </div>

        <div class="teaser-note">
            🎬 فيه مفأجات كتير جوا 😉 !
        </div>

        <button class="btn-locked" onclick="teaseSafa()">جربي تفتحي كده 😉</button>
        <p id="tease-msg" style="color: var(--gold); margin-top: 14px; margin-bottom: 0; display: none; font-size: 0.9rem; font-weight: 700;">
            يا عسل استني العداد يخلص الأول!
        </p>
    </div>

    <script>
        const TARGET_BIRTHDAY = new Date("2026-11-22T00:00:00");
        const promoMusic = document.getElementById("promo-music");
        const musicBtn = document.getElementById("music-control");
        promoMusic.volume = 0.7;

        function tryPlayMusic() {
            if (promoMusic.paused) {
                promoMusic.play().then(() => {
                    musicBtn.innerText = "🔊";
                }).catch(() => {
                    musicBtn.innerText = "🔇";
                });
            }
        }

        window.addEventListener("load", tryPlayMusic);
        document.body.addEventListener("click", tryPlayMusic, { once: true });
        document.body.addEventListener("touchstart", tryPlayMusic, { once: true });

        function toggleMusic() {
            if (promoMusic.paused) {
                promoMusic.play();
                musicBtn.innerText = "🔊";
            } else {
                promoMusic.pause();
                musicBtn.innerText = "🔇";
            }
        }

        function updateCountdown() {
            const now = new Date();
            const diff = TARGET_BIRTHDAY - now;
            if (diff > 0) {
                document.getElementById("p-days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("p-hours").innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
                document.getElementById("p-minutes").innerText = Math.floor((diff / 1000 / 60) % 60);
                document.getElementById("p-seconds").innerText = Math.floor((diff / 1000) % 60);
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        const teaseReplies = [
            " استني العداد يخلص الأول!",
            "برضو بتجربي؟ قلنا يوم 22 / 11 الساعة 12 بالليل!",
            " هانت كلها كام يوم!"
        ];
        let teaseCount = 0;

        function teaseSafa() {
            tryPlayMusic();
            const card = document.getElementById("promo-card");
            const msg = document.getElementById("tease-msg");
            msg.innerText = teaseReplies[teaseCount % teaseReplies.length];
            teaseCount++;
            msg.style.display = "block";
            card.style.animation = "none";
            setTimeout(() => { card.style.animation = "shake 0.4s ease"; }, 10);
        }

        // قلوب خفيفة في الخلفية
        setInterval(() => {
            const el = document.createElement("div");
            el.className = "floating-heart";
            el.innerText = "✨سوسو";
            el.style.left = Math.random() * 100 + "vw";
            el.style.fontSize = (Math.random() * 12 + 12) + "px";
            el.style.animationDuration = (Math.random() * 3 + 5) + "s";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 8000);
        }, 800);
    </script>
</body>
</html>
